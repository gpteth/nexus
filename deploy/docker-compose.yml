services:
  nexus:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: nexus:latest
    ports:
      - "8080:8080"
    environment:
      # 上游密钥通过环境变量注入，配置文件以 ${VAR} 引用
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/local/bin/nexus", "-help"]
      interval: 30s
      timeout: 5s
      retries: 3
