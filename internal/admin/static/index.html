<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nexus 管理控制台</title>
<style>
  :root {
    --bg: #0a0f1a; --panel: #0f1826; --card: #131e30; --line: #1e2b40;
    --text: #e2e8f0; --muted: #8aa0b8; --green: #10b981; --cyan: #22d3ee;
    --amber: #f59e0b; --red: #ef4444; --blue: #38bdf8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.6 -apple-system, "Segoe UI", Roboto, "PingFang SC", sans-serif; }
  /* 登录 */
  #login { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .login-card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 36px; width: 360px; }
  .login-card h1 { font-size: 22px; margin-bottom: 4px; }
  .login-card p { color: var(--muted); margin-bottom: 22px; font-size: 13px; }
  input { width: 100%; padding: 11px 13px; background: var(--card); border: 1px solid var(--line); border-radius: 9px; color: var(--text); font-size: 14px; outline: none; }
  input:focus { border-color: var(--green); }
  button { cursor: pointer; border: none; border-radius: 9px; font-size: 14px; font-weight: 600; }
  .btn-primary { width: 100%; padding: 12px; margin-top: 14px; background: var(--green); color: #041610; }
  .btn-primary:hover { filter: brightness(1.08); }
  .err { color: var(--red); font-size: 13px; margin-top: 10px; min-height: 18px; }
  /* 主布局 */
  #app { display: none; min-height: 100vh; }
  .topbar { height: 58px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .brand { font-size: 17px; font-weight: 700; letter-spacing: .3px; }
  .brand span { color: var(--green); }
  .top-right { display: flex; align-items: center; gap: 16px; color: var(--muted); font-size: 13px; }
  .logout { background: transparent; color: var(--muted); border: 1px solid var(--line); padding: 7px 14px; }
  .logout:hover { color: var(--text); border-color: var(--muted); }
  .layout { display: flex; min-height: calc(100vh - 58px); }
  .sidebar { width: 200px; background: var(--panel); border-right: 1px solid var(--line); padding: 16px 12px; flex-shrink: 0; }
  .nav-item { padding: 10px 14px; border-radius: 9px; color: var(--muted); cursor: pointer; font-weight: 500; margin-bottom: 4px; }
  .nav-item:hover { color: var(--text); background: var(--card); }
  .nav-item.active { color: var(--green); background: rgba(16,185,129,.1); }
  .content { flex: 1; padding: 28px 32px; overflow: auto; }
  .view-title { font-size: 20px; margin-bottom: 20px; }
  /* 统计卡片 */
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
  .stat .num { font-size: 28px; font-weight: 700; margin: 6px 0 2px; }
  .stat .lbl { color: var(--muted); font-size: 13px; }
  .stat .num.green { color: var(--green); } .stat .num.cyan { color: var(--cyan); }
  .stat .num.amber { color: var(--amber); } .stat .num.red { color: var(--red); }
  /* 表格 */
  table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid var(--line); font-size: 13px; }
  th { color: var(--muted); font-weight: 600; background: var(--panel); }
  tr:last-child td { border-bottom: none; }
  td .mono { font-family: "SF Mono", Menlo, monospace; font-size: 12px; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .b-green { background: rgba(16,185,129,.15); color: var(--green); }
  .b-cyan { background: rgba(34,211,238,.15); color: var(--cyan); }
  .b-amber { background: rgba(245,158,11,.15); color: var(--amber); }
  .b-red { background: rgba(239,68,68,.15); color: var(--red); }
  .b-gray { background: rgba(138,160,184,.15); color: var(--muted); }
  .b-blue { background: rgba(56,189,248,.15); color: var(--blue); }
  .bar { height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; width: 120px; display: inline-block; vertical-align: middle; }
  .bar i { display: block; height: 100%; background: var(--green); }
  .muted { color: var(--muted); }
  .empty { color: var(--muted); padding: 40px; text-align: center; }
</style>
</head>
<body>
<div id="login">
  <div class="login-card">
    <h1>Nexus 管理控制台</h1>
    <p>统一 LLM 与算力服务平台 · 运维管理</p>
    <input id="username" placeholder="用户名" autocomplete="username" />
    <input id="password" type="password" placeholder="密码" style="margin-top:12px" autocomplete="current-password" />
    <button class="btn-primary" onclick="doLogin()">登 录</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <div class="brand">Nexus <span>Console</span></div>
    <div class="top-right"><span id="who"></span><button class="logout" onclick="logout()">退出</button></div>
  </div>
  <div class="layout">
    <div class="sidebar" id="nav"></div>
    <div class="content" id="content"></div>
  </div>
</div>

<script>
const API = '/api/admin';
let token = localStorage.getItem('nexus_admin_token') || '';
let currentView = 'overview';
let refreshTimer = null;

const VIEWS = [
  { key: 'overview', label: '概览' },
  { key: 'tenants', label: '租户' },
  { key: 'keys', label: '密钥' },
  { key: 'tickets', label: '工单' },
  { key: 'nodes', label: '算力节点' },
  { key: 'jobs', label: '调度作业' },
];

async function api(path, options = {}) {
  const res = await fetch(API + path, {
    ...options,
    headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) },
  });
  if (res.status === 401) { logout(); throw new Error('unauthorized'); }
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || 'request failed');
  return res.json();
}

async function doLogin() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const errEl = document.getElementById('loginErr');
  errEl.textContent = '';
  try {
    const data = await fetch(API + '/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    }).then(r => r.ok ? r.json() : r.json().then(e => { throw new Error(e.error); }));
    token = data.token;
    localStorage.setItem('nexus_admin_token', token);
    enterApp();
  } catch (e) { errEl.textContent = '登录失败：' + e.message; }
}

function enterApp() {
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  renderNav();
  switchView('overview');
}

function logout() {
  token = '';
  localStorage.removeItem('nexus_admin_token');
  if (refreshTimer) clearInterval(refreshTimer);
  document.getElementById('app').style.display = 'none';
  document.getElementById('login').style.display = 'flex';
}

function renderNav() {
  document.getElementById('nav').innerHTML = VIEWS.map(v =>
    `<div class="nav-item ${v.key === currentView ? 'active' : ''}" onclick="switchView('${v.key}')">${v.label}</div>`
  ).join('');
}

function switchView(key) {
  currentView = key;
  if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
  renderNav();
  render();
  if (key === 'overview') refreshTimer = setInterval(render, 5000);
}

async function render() {
  const c = document.getElementById('content');
  try {
    if (currentView === 'overview') c.innerHTML = renderOverview(await api('/overview'));
    else if (currentView === 'tenants') c.innerHTML = table('租户', ['ID', '名称', '限流 RPM', '预算 USD'],
      (await api('/tenants')).map(t => [t.id, t.name, t.rpm, '$' + t.budgetUSD]));
    else if (currentView === 'keys') c.innerHTML = table('密钥', ['ID', '密钥（掩码）', '租户', '状态', '模型'],
      (await api('/keys')).map(k => [k.id, `<span class="mono">${k.masked_key}</span>`, k.tenant_id,
        badge(k.enabled ? '启用' : '停用', k.enabled ? 'green' : 'gray'), (k.models || []).join(', ') || '不限']));
    else if (currentView === 'tickets') c.innerHTML = table('工单', ['ID', '标题', '状态', '派工数', '最新上报', '更新时间'],
      (await api('/tickets')).map(t => [t.id, t.title, badge(t.state, t.state === 'open' ? 'amber' : 'green'),
        t.assignments, t.latest_report ? badge(t.latest_report, reportColor(t.latest_report)) : '-', fmt(t.updated_at)]));
    else if (currentView === 'nodes') c.innerHTML = table('算力节点', ['ID', '类型', '状态', '内存占用', '槽位', '心跳'],
      (await api('/nodes')).map(n => [n.id, n.kind, badge(n.state, nodeColor(n.state)),
        usageBar(n.used.memory_mb, n.capacity.memory_mb), `${n.used.slots}/${n.capacity.slots}`, fmt(n.last_beat)]));
    else if (currentView === 'jobs') c.innerHTML = table('调度作业', ['ID', '租户', '优先级', '状态', '节点', '入队时间'],
      (await api('/jobs')).map(j => [j.id, j.tenant_id, j.priority, badge(j.state, jobColor(j.state)),
        j.node_id || '-', fmt(j.enqueued_at)]));
  } catch (e) { c.innerHTML = `<div class="empty">加载失败：${e.message}</div>`; }
}

function renderOverview(d) {
  const cards = [
    ['租户', d.tenants, 'cyan'], ['密钥', d.keys, 'cyan'],
    ['工单总数', d.tickets, ''], ['开放工单', d.open_tickets, 'amber'],
    ['节点总数', d.nodes, ''], ['健康节点', d.healthy_nodes, 'green'],
    ['作业总数', d.jobs, ''], ['运行中', d.running_jobs, 'green'],
  ];
  return `<div class="view-title">概览</div><div class="stat-grid">${cards.map(([l, n, c]) =>
    `<div class="stat"><div class="lbl">${l}</div><div class="num ${c}">${n}</div></div>`).join('')}</div>`;
}

function table(title, headers, rows) {
  if (!rows.length) return `<div class="view-title">${title}</div><div class="empty">暂无数据</div>`;
  return `<div class="view-title">${title}</div><table><thead><tr>${headers.map(h => `<th>${h}</th>`).join('')}
    </tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}

function badge(text, color) { return `<span class="badge b-${color}">${text}</span>`; }
function usageBar(used, total) {
  const pct = total ? Math.round(100 * used / total) : 0;
  return `<span class="bar"><i style="width:${pct}%"></i></span> ${used}/${total} MB`;
}
const nodeColor = s => ({ healthy: 'green', unhealthy: 'red', draining: 'amber' })[s] || 'gray';
const jobColor = s => ({ running: 'green', queued: 'amber', succeeded: 'cyan', failed: 'red', preempted: 'gray' })[s] || 'gray';
const reportColor = s => ({ ready: 'green', blocked: 'amber', failed: 'red', progress: 'blue', waiting: 'cyan' })[s] || 'gray';
function fmt(iso) { return iso ? new Date(iso).toLocaleString('zh-CN', { hour12: false }) : '-'; }

document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
if (token) enterApp();
</script>
</body>
</html>
