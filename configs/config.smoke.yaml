server:
  listen: "127.0.0.1:8080"
log:
  level: "info"
  format: "text"
gateway:
  upstreams:
    - name: "mock"
      type: "openai"
      base_url: "http://127.0.0.1:9000/v1"
      weight: 1
      models: ["mock-model"]
auth:
  keys:
    - key: "sk-nexus-smoke"
      tenant: "default"
tenants:
  - id: "default"
    name: "Smoke"
metrics:
  enabled: true
  path: "/metrics"
